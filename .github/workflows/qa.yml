name: Full game QA

on:
  push:
    branches:
      - main
      - 'qa/**'
      - 'upgrade/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save playwright@latest
      - run: npx playwright install --with-deps chromium
      - run: node qa/browser.cjs

  live-production:
    if: github.ref == 'refs/heads/main'
    needs: [unit-and-api, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/live-smoke.cjs
        env:
          LIVE_URL: https://astra-dnd-game.vercel.app
          GITHUB_SHA: ${{ github.sha }}
